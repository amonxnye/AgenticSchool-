# Firebase App Hosting configuration.
#
# One-time setup before the first real rollout:
#   1. Link a Firebase web app to this backend so FIREBASE_WEBAPP_CONFIG is provided at build time.
#   2. Enable Firestore (production mode) and Google sign-in in Firebase Authentication.
#   3. Set ADMIN_EMAILS below to the addresses that may open /admin.
#   4. Create the encryption secret, grant the backend access, then uncomment the block below.
#      A rollout fails if the block references a secret that does not exist yet.
#        openssl rand -base64 32 | firebase apphosting:secrets:set settings-encryption-key --data-file=-
#        firebase apphosting:secrets:grantaccess settings-encryption-key --backend agentschool
#      Until then the app runs, but /admin/settings cannot save API keys.
#
# Model provider API keys are entered in /admin/settings and stored encrypted in Firestore.
env:
  - variable: ADMIN_EMAILS
    value: "replace-with-your-email@example.com"
    availability:
      - RUNTIME
  # - variable: SETTINGS_ENCRYPTION_KEY
  #   secret: settings-encryption-key
  #   availability:
  #     - RUNTIME
